<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark"></span><span>Sam</span></div>
    <div id="clock">--:--</div>
  </header>
  <main>
    <div id="grid" role="grid" aria-label="Home screen"></div>
    <p class="help">Arrows to move &middot; OK to open &middot; Back to TizenBrew &middot; Soundbar stays on Receiver (HDMI ARC)</p>
    <p id="notice" class="notice hidden"></p>
  </main>
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-box">
      <h2 id="overlay-title">Note</h2>
      <p id="overlay-text"></p>
      <button id="overlay-close" type="button">OK</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
